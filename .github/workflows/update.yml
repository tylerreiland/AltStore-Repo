name: Update Source JSON

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you run it manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update apps.json from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api repos/itzzace/ytkace/releases/latest | jq '
            . as $rel
            | ([.assets[]
                | select(.name | endswith(".ipa") and (test("ios16"; "i") | not))]
               | sort_by(.name) | last) as $a
            | if $a == null then error("no iOS 17+ IPA found") else . end
            | ($a.name | capture("_(?<v>[0-9]+(\\.[0-9]+)+)\\.ipa$").v
                // error("no version in filename: " + $a.name)) as $v
            | ("v" + ($rel.tag_name | ltrimstr("v"))) as $tag
            | {
                version:              $v,
                versionDate:          $rel.published_at[0:10],
                downloadURL:          $a.browser_download_url,
                size:                 $a.size,
                localizedDescription: ("📝[" + $tag + " release notes](" + $rel.html_url + ")"),
                versionDescription:   ($rel.body // "See release notes: " + $rel.html_url)
              }' > update.json

          jq -s '.[0].apps[0] += .[1] | .[0]' apps.json update.json > tmp.json
          mv tmp.json apps.json
          rm update.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apps.json
          git diff --cached --quiet || (git commit -m "Update to latest YTKACE release" && git push)
